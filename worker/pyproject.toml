[project]
name = "canvas-worker"
version = "0.1.0"
description = "共有キャンバス用 Cloudflare Python Worker"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
